name: Sync upstream and build Android APK

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build an APK even when upstream has no new mobile changes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: upstream-android-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge official T3 Code
    runs-on: ubuntu-latest
    outputs:
      mobile_changed: ${{ steps.merge.outputs.mobile_changed }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Require upstream sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_SYNC_TOKEN repository secret. See .github/ANDROID_BUILDS.md."
            exit 1
          fi

      - name: Checkout fork default branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream and push fork
        id: merge
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/main "$before"; then
            echo "No upstream commits to merge."
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$before" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff upstream/main

          after="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "merge_sha=$after" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$before" "$after" | grep -q '^apps/mobile/'; then
            echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build and publish universal APK
    needs: sync
    if: needs.sync.outputs.mobile_changed == 'true' || inputs.force_build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_ANDROID_PACKAGE: com.t3tools.t3code
    steps:
      - name: Checkout merged fork
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.merge_sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/android-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Include public account configuration
        run: |
          cp .env.example .env
          grep -q '^T3CODE_CLERK_PUBLISHABLE_KEY=pk_live_' .env
          grep -q '^T3CODE_CLERK_JWT_TEMPLATE=' .env

      - name: Generate Android project from scratch
        run: pnpm --filter @t3tools/mobile exec expo prebuild --clean --platform android

      - name: Clean and build release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify package, signing key, and universal APK
        run: |
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -f "$apk" && test -x "$apksigner" && test -x "$aapt"

          package="$("$aapt" dump badging "$apk" | awk -F "'" '/^package: name=/ { print $2; exit }')"
          if [ "$package" != "com.t3tools.t3code" ]; then
            echo "::error::Unexpected Android package ID: $package"
            exit 1
          fi

          expected_cert="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          actual_cert="$("$apksigner" verify --print-certs "$apk" | sed -nE 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::APK signature does not match the configured Android keystore (expected certificate SHA-256: $expected_cert; APK certificate SHA-256: ${actual_cert:-missing})."
            exit 1
          fi

          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd, -)"
          abi_count="$(printf '%s' "$abis" | awk -F, '{ print NF }')"
          if [ "$abi_count" -lt 2 ]; then
            echo "::error::Expected a universal APK with multiple native ABIs; found: $abis"
            exit 1
          fi
          echo "Verified package=$package ABIs=$abis signingCertificateSHA256=$actual_cert"

      - name: Name release asset
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk t3code-universal.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-${{ github.run_number }}-${{ needs.sync.outputs.merge_sha }}
          name: Android build ${{ github.run_number }}
          body: |
            Automatically built from the latest upstream merge that changed `apps/mobile`.

            This is a universal Android release APK signed with this fork's private signing key.
          files: t3code-universal.apk
          make_latest: true
